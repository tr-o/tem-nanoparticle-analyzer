name: v15 paired uncertainty by independent EMPS test image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy and matplotlib
        run: pip install numpy matplotlib
      - name: Compute image-level paired bootstrap; produce chart and report
        run: python scripts/v15_paired_uncertainty.py --metrics experiments/v15/results/metrics.json --outdir experiments/v15
      - name: Verify all embedded images
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('experiments/v15');s=(p/'UNCERTAINTY.md').read_text()
          for q in re.findall(r'!\[[^\]]*\]\(([^)]+)\)',s):assert (p/q).is_file(),q
          PY
      - name: Commit chart and uncertainty report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v15/UNCERTAINTY.md experiments/v15/results/bootstrap_ci.json experiments/v15/results/bootstrap_ci.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Quantify v15 image-level uncertainty with reproducible figure [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
