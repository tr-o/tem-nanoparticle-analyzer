name: Contour coordinate regression
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy scipy opencv-python-headless
      - run: python -m unittest discover -s v7 -p 'test_*.py' -v
      - run: python -m py_compile contour_coordinates.py experiments/v2/tem_v2.py experiments/v4/tem_v4.py experiments/v7/diagnose_overlay_shift.py
