name: v11 instance-separation validation tuned on train only
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trainval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: |
          pip install -r requirements.txt
          pip install pillow
      - name: Tests for frozen parameter grid and safe metrics
        run: |
          PYTHONPATH=v11 python -m unittest discover -s v11 -p test_v11.py -v
      - name: Get pinned EMPS dataset
        id: get_data
        continue-on-error: true
        run: |
          git clone --depth 1 --quiet https://github.com/by256/emps.git /tmp/emps
          test "$(git -C /tmp/emps rev-parse HEAD)" = "dd8f86d714894fd08f3db80041893982ce058dd6"
      - name: Train RF, tune 20 combinations on train-only validation, score heldout test
        id: evaluate
        if: steps.get_data.outcome == 'success'
        continue-on-error: true
        run: |
          python experiments/v11/tune_instances.py --dataset-root /tmp/emps --out experiments/v11/results --train-n 28 --val-n 6 --test-n 8
      - name: Prepare image-embedded report, accurately track success or failure
        env:
          FETCH: ${{ steps.get_data.outcome }}
          EVAL: ${{ steps.evaluate.outcome }}
        run: |
          python - <<'PY'
          import pathlib,json,os
          root=pathlib.Path('experiments/v11')
          (root/'status.json').write_text(json.dumps({'dataset':os.environ['FETCH'],'evaluation':os.environ.get('EVAL','skipped'),
                'real_metrics':(root/'results/metrics.json').exists()},indent=2))
          PY
          python experiments/v11/build_report.py
      - name: Verify embedded image files
        run: |
          python - <<'PY'
          import pathlib,re
          root=pathlib.Path('experiments/v11')
          for u in re.findall(r'!\[[^]]*\]\(([^)]+)\)',(root/'REPORT.md').read_text()):
            assert (root/u).is_file(),u
          PY
      - name: Commit derived measurements only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v11/REPORT.md experiments/v11/status.json
          if [ -d experiments/v11/results ]; then git add experiments/v11/results; fi
          if ! git diff --cached --quiet; then
             git commit -m 'Record v11 train-only parameter tuning and heldout EMPS results [skip ci]'
             git pull --rebase origin main
             git push origin HEAD:main
          fi
