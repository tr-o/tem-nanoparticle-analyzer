name: v10 EMPS real annotated particle instance benchmark
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: v10-emps
  cancel-in-progress: false
jobs:
  emps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific environment
        run: |
          pip install -r requirements.txt
          pip install pillow
      - name: Test metric correctness and exact instance matching
        run: |
          PYTHONPATH=v10 python -m unittest discover -s v10 -p 'test_emps.py' -v
      - name: Get published EMPS images and expert instance labels
        id: get_data
        continue-on-error: true
        run: |
          git clone --depth 1 --quiet https://github.com/by256/emps.git /tmp/emps
          echo "Public EMPS commit $(git -C /tmp/emps rev-parse HEAD)"
          test "$(git -C /tmp/emps rev-parse HEAD)" = "dd8f86d714894fd08f3db80041893982ce058dd6"
          test -f /tmp/emps/train.csv
          test -f /tmp/emps/test.csv
      - name: Train only on official train and evaluate on official test
        id: benchmark
        if: steps.get_data.outcome == 'success'
        continue-on-error: true
        run: |
          python experiments/v10/benchmark_emps.py --dataset-root /tmp/emps \
            --out experiments/v10/results_emps --train-count 28 --test-count 8
      - name: Document exact evaluation outcome and embedded images
        env:
          FETCH_STATE: ${{ steps.get_data.outcome }}
          EVAL_STATE: ${{ steps.benchmark.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          d=pathlib.Path('experiments/v10')
          (d/'emps_status.json').write_text(json.dumps({
            'acquire':os.environ['FETCH_STATE'], 'evaluation':os.environ.get('EVAL_STATE','skipped'),
            'metrics_available':(d/'results_emps/metrics.json').exists(),
            'dataset_sha':'dd8f86d714894fd08f3db80041893982ce058dd6',
            'training_test_split':'official EMPS train.csv / test.csv'},indent=2))
          PY
          python experiments/v10/build_report.py
      - name: Verify all markdown images point to real files
        run: |
          python - <<'PY'
          import pathlib,re
          base=pathlib.Path('experiments/v10');doc=(base/'REPORT.md').read_text()
          for u in re.findall(r'!\[[^]]*\]\(([^)]+)\)',doc):
            p=base/u
            assert p.exists(),str(p)
          PY
      - name: Commit reproducible measurements and preview figures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v10/REPORT.md experiments/v10/emps_status.json
          if [ -d experiments/v10/results_emps ]; then git add experiments/v10/results_emps; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Benchmark actual EMPS manual nanoparticle instances [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
