name: v15 more annotated training data - untouched EMPS test
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis libraries
        run: |
          python -m pip install -r requirements.txt
          pip install pillow
      - name: Run data-separation regression tests
        run: PYTHONPATH=v15 python -m unittest discover -s v15 -p 'test_v15.py' -v
      - name: Fetch pinned EMPS dataset
        id: data
        continue-on-error: true
        run: |
          git clone --depth 1 --quiet https://github.com/by256/emps.git /tmp/emps
          test "$(git -C /tmp/emps rev-parse HEAD)" = "dd8f86d714894fd08f3db80041893982ce058dd6"
      - name: Compare frozen 28 vs 96 training examples on fresh 20-image official test
        id: eval
        if: steps.data.outcome == 'success'
        continue-on-error: true
        run: python experiments/v15/data_scale_benchmark.py --dataset-root /tmp/emps --out experiments/v15/results --count 20
      - name: Save evaluation status and illustrated Markdown report
        if: always()
        env:
          DATA_STATE: ${{ steps.data.outcome }}
          EVAL_STATE: ${{ steps.eval.outcome }}
        run: |
          python - <<'PY'
          import pathlib,json,os
          p=pathlib.Path('experiments/v15')
          s={'data':os.environ['DATA_STATE'],'evaluation':os.environ['EVAL_STATE']}
          if s['evaluation']=='success' and not (p/'results/metrics.json').exists():raise ValueError('Metrics absent after success')
          (p/'status.json').write_text(json.dumps(s,indent=2)+'\n')
          PY
          python experiments/v15/build_report.py
      - name: Validate all report images and test identities
        run: |
          python - <<'PY'
          import pathlib,re,json
          p=pathlib.Path('experiments/v15');text=(p/'REPORT.md').read_text()
          for src in re.findall(r'!\[[^\]]*\]\(([^)]+)\)',text): assert (p/src).exists(),src
          status=json.loads((p/'status.json').read_text())
          if status['evaluation']=='success':
            d=json.loads((p/'results/metrics.json').read_text())
            assert len(d['test_ids'])==20
            assert not (set(d['test_ids'])&set(d['historical_test_ids']))
            assert len(d['v15_train_ids'])==96
          PY
      - name: Commit derived evaluation figures and report only
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v15/REPORT.md experiments/v15/status.json
          if [ -d experiments/v15/results ]; then git add experiments/v15/results/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record v15 annotated training-scale benchmark [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
