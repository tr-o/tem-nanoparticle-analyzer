name: v14 polarity-symmetric segmentation - fresh EMPS test subset
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reproducible dependencies
        run: |
          python -m pip install -r requirements.txt
          pip install pillow
      - name: Run pre-registered regression tests
        run: PYTHONPATH=v14 python -m unittest discover -s v14 -p 'test_v14.py' -v
      - name: Get pinned official EMPS dataset
        id: data
        continue-on-error: true
        run: |
          git clone --depth 1 --quiet https://github.com/by256/emps.git /tmp/emps
          test "$(git -C /tmp/emps rev-parse HEAD)" = "dd8f86d714894fd08f3db80041893982ce058dd6"
      - name: Run new test subset exactly once with frozen model settings
        id: eval
        if: steps.data.outcome == 'success'
        continue-on-error: true
        run: python experiments/v14/polarity_benchmark.py --dataset-root /tmp/emps --out experiments/v14/results --count 20
      - name: Summarize verified status and render report
        if: always()
        env:
          DATA_STATE: ${{ steps.data.outcome }}
          EVAL_STATE: ${{ steps.eval.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path('experiments/v14')
          d={'download':os.environ['DATA_STATE'],'evaluation':os.environ['EVAL_STATE']}
          if d['evaluation']=='success' and not (root/'results/metrics.json').exists():
            raise SystemExit('Evaluation reports success but metrics missing')
          (root/'status.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          python experiments/v14/build_report.py
      - name: Verify markdown images and results integrity
        run: |
          python - <<'PY'
          import pathlib,re,json
          r=pathlib.Path('experiments/v14');doc=(r/'REPORT.md').read_text()
          for x in re.findall(r'!\[[^\]]*\]\(([^)]+)\)',doc):
            assert (r/x).is_file(),f'Missing image: {x}'
          d=json.loads((r/'status.json').read_text())
          if d['evaluation']=='success':
            s=json.loads((r/'results/metrics.json').read_text())
            assert len(s['new_test_ids'])==20
            assert not (set(s['new_test_ids'])&set(s['previously_used_test_ids']))
            assert all(s[m]['tp']+s[m]['fn']>=0 for m in ('v13','v14'))
          PY
      - name: Commit only derived reports, preview images, and metrics (not raw dataset)
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v14/REPORT.md experiments/v14/status.json
          if [ -d experiments/v14/results ]; then git add experiments/v14/results/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record v14 fresh-test polarity benchmark and illustrated results [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
